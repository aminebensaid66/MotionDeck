name: ci

on:
  push:
  pull_request:

jobs:
  build-and-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run build
      - run: node --test test/security.test.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 runners block the unprivileged user namespaces Chrome's sandbox needs.
      - run: SKIP_VIDEO=1 npm test
        env:
          MOTIONDECK_NO_SANDBOX: "1"
